name: Build and deploy Luvent

# This is what makes the whole system phone-only. Node/npm never need
# to run on your device — GitHub's own servers run the build every
# time you edit a file through the GitHub mobile app or website editor
# and commit. You never install anything or open a terminal.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: node build.js

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# One-time setup (done once, from any browser, including on a phone):
# Repo Settings -> Pages -> Source -> "GitHub Actions".
# After that, every push to main rebuilds and redeploys automatically.
